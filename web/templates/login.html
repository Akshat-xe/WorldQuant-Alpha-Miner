<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Alpha Studio - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%230284c7%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22%2338bdf8%22/></svg>">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: rgba(5, 10, 22, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.12);
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .login-brand-icon {
            width: 42px;
            height: 42px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }
        .form-input {
            width: 100%;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 9999px;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 25px rgba(14, 165, 233, 0.4);
        }
        .btn-submit:hover {
            box-shadow: 0 6px 35px rgba(14, 165, 233, 0.65);
            transform: translateY(-1px);
        }
        .auth-error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #f43f5e;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.775rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .login-footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-brand-icon">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="7" r="2.2" fill="#38bdf8" />
                        <circle cx="9" cy="15" r="2.2" fill="#38bdf8" />
                        <circle cx="16" cy="15" r="3.0" fill="#38bdf8" />
                        <circle cx="23" cy="15" r="2.2" fill="#38bdf8" />
                        <circle cx="12" cy="23" r="2.2" fill="#38bdf8" />
                        <circle cx="20" cy="23" r="2.2" fill="#38bdf8" />
                    </svg>
                </div>
                <div>
                    <h2 style="font-size: 1.15rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;">QUANTUM ALPHA STUDIO</h2>
                    <span style="font-size: 0.7rem; color: var(--accent-cyan); font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;">WorldQuant BRAIN Gateway</span>
                </div>
            </div>

            <p style="font-size: 0.825rem; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.5;">
                Sign in with your official WorldQuant BRAIN credentials to sync your consultant portfolio, streak, and autonomous pipeline.
            </p>

            <div id="login-error" class="auth-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">WorldQuant BRAIN Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="user@university.edu" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label">WorldQuant BRAIN Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.775rem; color: var(--text-muted);">
                    <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                        <input type="checkbox" id="remember-me" checked> Remember session
                    </label>
                    <a href="https://support.worldquantbrain.com" target="_blank" style="color: var(--text-secondary); text-decoration: none;">Help & FAQ</a>
                </div>

                <button type="submit" id="btn-login-submit" class="btn-submit">
                    Sign In & Authenticate &rarr;
                </button>
            </form>

            <div class="login-footer">
                Direct authentication verifies via <code style="color: #38bdf8;">api.worldquantbrain.com</code>.<br>
                Need an account? <a href="https://worldquantbrain.com" target="_blank">Sign up at WorldQuant BRAIN</a>
            </div>
        </div>
    </div>

    <script src="/static/js/particles.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login-submit');
            const errDiv = document.getElementById('login-error');

            btn.disabled = true;
            btn.textContent = '⏳ Authenticating with WorldQuant BRAIN...';
            errDiv.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    btn.textContent = '✓ Verified! Redirecting...';
                    window.location.href = data.redirect || '/engine-select';
                } else {
                    errDiv.textContent = data.error || 'Authentication failed. Please verify your email and password.';
                    errDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign In & Authenticate →';
                }
            } catch (err) {
                errDiv.textContent = 'Network error connecting to authentication server.';
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In & Authenticate →';
            }
        });
    </script>
</body>
</html>
